name: Deploy to Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Create firebase.json
        run: |
          cat > firebase.json << 'EOF'
          {
            "hosting": {
              "site": "lntcmmb-intelligence",
              "public": ".",
              "ignore": [
                "firebase.json",
                "**/.*",
                "scripts/**",
                ".github/**",
                "data/**",
                "**/*.py",
                "**/*.yml",
                "sa_temp.txt"
              ],
              "headers": [
                {
                  "source": "**",
                  "headers": [
                    {"key": "Cache-Control", "value": "no-cache, no-store, must-revalidate"}
                  ]
                }
              ]
            }
          }
          EOF

      - name: Create .firebaserc
        run: |
          cat > .firebaserc << 'EOF'
          {
            "projects": {
              "default": "lntcmmb-intelligence1"
            }
          }
          EOF

      - name: Create hosting site (if not exists)
        run: |
          firebase hosting:sites:create lntcmmb-intelligence --project lntcmmb-intelligence1 2>/dev/null && echo "Site created" || echo "Site already exists"
        continue-on-error: true

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy --only hosting:lntcmmb-intelligence --project lntcmmb-intelligence1
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Success
        run: |
          echo ""
          echo "==================================================="
          echo "✅  LNTCMMB deployed to Firebase Hosting"
          echo "==================================================="
          echo "Main Dashboard:      https://lntcmmb-intelligence.web.app/"
          echo "Used Equipment:      https://lntcmmb-intelligence.web.app/used-equipment.html"
          echo "AI Pitch Generator:  https://lntcmmb-intelligence.web.app/pitch-generator.html"
          echo "==================================================="
