name: Deploy to Firebase Hosting

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Write service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json

      - name: Create Firebase config
        run: |
          cat > firebase.json << 'EOF'
          {
            "hosting": {
              "site": "lntcmmb-intelligence",
              "public": ".",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**", "scripts/**", ".github/**", "data/**"],
              "headers": [
                {
                  "source": "**",
                  "headers": [
                    { "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" }
                  ]
                }
              ],
              "rewrites": [
                { "source": "/", "destination": "/index.html" }
              ]
            }
          }
          EOF

      - name: Create Firebase project config
        run: |
          cat > .firebaserc << 'EOF'
          {
            "projects": {
              "default": "lntcmmb-intelligence1"
            },
            "targets": {
              "lntcmmb-intelligence1": {
                "hosting": {
                  "lntcmmb-intelligence": ["lntcmmb-intelligence"]
                }
              }
            }
          }
          EOF

      - name: Create hosting site if not exists
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          firebase hosting:sites:create lntcmmb-intelligence --project lntcmmb-intelligence1 || echo "Site may already exist, continuing..."

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          firebase deploy --only hosting:lntcmmb-intelligence --project lntcmmb-intelligence1

      - name: Show live URLs
        run: |
          echo ""
          echo "🚀 DEPLOYED TO FIREBASE HOSTING"
          echo "================================"
          echo "Main Dashboard:     https://lntcmmb-intelligence.web.app/"
          echo "Used Equipment:     https://lntcmmb-intelligence.web.app/used-equipment.html"
          echo "AI Pitch Generator: https://lntcmmb-intelligence.web.app/pitch-generator.html"
