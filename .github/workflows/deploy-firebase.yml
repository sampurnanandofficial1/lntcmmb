name: Deploy to Firebase Hosting

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create firebase.json
        run: |
          cat > firebase.json << 'FEOF'
          {
            "hosting": {
              "site": "lntcmmb-intelligence",
              "public": ".",
              "ignore": ["firebase.json","**/.*","scripts/**",".github/**","data/**","**/*.py","**/*.yml","**/*.json","sa_export.b64"]
            }
          }
          FEOF

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: lntcmmb-intelligence1
          target: lntcmmb-intelligence
          channelId: live

      - name: Done
        run: |
          echo "Deployed: https://lntcmmb-intelligence.web.app"
