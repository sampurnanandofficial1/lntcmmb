name: Test Firebase Connectivity (Manual Only)
# This workflow only tests connectivity. It does NOT deploy.
# Deployment is handled by 'Deploy to Firebase (Self-Hosted)' workflow.
# The service account secret is not required here.

on:
  workflow_dispatch:   # manual trigger only — never auto-fires on push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Firebase Hosting connectivity
        run: |
          echo "Testing firebasehosting.googleapis.com..."
          RESULT=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 https://firebasehosting.googleapis.com/v1beta1/ 2>&1 || echo "FAILED")
          echo "Result: $RESULT"
          if [ "$RESULT" = "FAILED" ]; then
            echo "::warning::Cannot reach firebasehosting.googleapis.com"
          else
            echo "Connectivity: OK ($RESULT)"
          fi

      - name: Summary
        run: |
          echo "========================================="
          echo "Firebase connectivity test complete."
          echo "To deploy, either:"
          echo "  1. Start the self-hosted runner in Codespace and push to main"
          echo "  2. Run: firebase deploy --only hosting:lntcmmb-dashboards"
          echo "========================================="
