name: Test and Deploy Firebase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'used-equipment.html'  
      - 'pitch-generator.html'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Firebase Hosting connectivity
        run: |
          echo "Testing firebasehosting.googleapis.com..."
          RESULT=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 https://firebasehosting.googleapis.com/v1beta1/ 2>&1 || echo "FAILED")
          echo "Result: $RESULT"
          if [ "$RESULT" = "FAILED" ]; then
            echo "::error::Cannot reach firebasehosting.googleapis.com"
            exit 1
          else
            echo "Connectivity: OK ($RESULT)"
          fi

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy using Service Account
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          firebase deploy --only hosting:lntcmmb-dashboards --project lntcmmb-intelligence1
          rm /tmp/sa.json
