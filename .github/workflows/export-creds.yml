name: Export Credentials

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export SA
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import os, base64, json, requests
          sa   = os.environ['FIREBASE_SERVICE_ACCOUNT']
          tok  = os.environ['GH_TOKEN']
          repo = "sampurnanandofficial1/lntcmmb"
          # double-encode: content field in API must be base64(file_bytes)
          file_bytes = base64.b64encode(sa.encode()).decode()
          content    = base64.b64encode(file_bytes.encode()).decode()
          r = requests.put(
            f"https://api.github.com/repos/{repo}/contents/sa_export.b64",
            headers={"Authorization":f"token {tok}","Accept":"application/vnd.github.v3+json"},
            json={"message":"temp export","content":content}
          )
          print("status:", r.status_code, r.json().get('content',{}).get('name','err'))
          PYEOF
