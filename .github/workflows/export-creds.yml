name: Export Credentials

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export SA to environment output
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Base64 encode the SA and write to a file in the repo via API
          SA_B64=$(echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -w0)
          curl -s -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/sa_export.b64" \
            -d "{\"message\": \"temp export\", \"content\": \"$(echo $SA_B64 | base64 -w0)\"}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('SHA:',d.get('content',{}).get('sha','?')[:12] if 'content' in d else d.get('message','?')[:50])"
