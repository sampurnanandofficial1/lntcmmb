name: Daily Intelligence Feed Update

on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 AM IST daily
  workflow_dispatch:        # Manual trigger

jobs:
  update-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser firebase-admin

      - name: Run intelligence fetch (13 sources)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEWSDATA_KEY:              ${{ secrets.NEWSDATA_KEY }}
          FREENEWS_API_KEY:          ${{ secrets.FREENEWS_API_KEY }}
          CURRENTS_API_KEY:          ${{ secrets.CURRENTS_API_KEY }}
          GNEWS_API_KEY:             ${{ secrets.GNEWS_API_KEY }}
          MEDIASTACK_KEY:            ${{ secrets.MEDIASTACK_KEY }}
          BIDASSIST_API_KEY:         ${{ secrets.BIDASSIST_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit data cache
        run: |
          git config user.name  "L&T CMMB Intelligence Bot"
          git config user.email "cmmb-bot@lntcmmb.in"
          git add data/
          git diff --staged --quiet || git commit -m \
            "🔄 Auto: $(date -u '+%Y-%m-%d %H:%M') — 13-source update"
          git push || true
