name: Daily Intelligence Feed Update

on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 AM IST
  workflow_dispatch:

jobs:
  update-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests feedparser firebase-admin
      - name: Run intelligence fetcher
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEWSDATA_API_KEY:          ${{ secrets.NEWSDATA_API_KEY }}
          CURRENTS_API_KEY:          ${{ secrets.CURRENTS_API_KEY }}
          DATAGOV_API_KEY:           ${{ secrets.DATAGOV_API_KEY }}
        run: python scripts/fetch_news.py
      - name: Commit data cache
        run: |
          git config user.name  "L&T CMMB Intelligence Bot"
          git config user.email "cmmb-bot@lntcmmb.in"
          git add data/ || true
          git diff --staged --quiet || git commit -m "🔄 Daily intelligence update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || true
