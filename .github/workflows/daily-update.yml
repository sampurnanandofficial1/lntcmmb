name: Daily Intelligence Feed Update

on:
  schedule:
    # Runs at 01:30 UTC = 07:00 AM IST every day
    - cron: '30 1 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Fetch live infrastructure intelligence
        run: python scripts/fetch_news.py

      - name: Commit and push updated data
        run: |
          git config user.name "L&T CMMB Intelligence Bot"
          git config user.email "cmmb-bot@larsentoubro.com"
          git add data/
          git diff --staged --quiet || git commit -m "🔄 Daily intelligence update - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
