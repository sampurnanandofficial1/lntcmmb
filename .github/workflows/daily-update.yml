name: Daily Intelligence Feed Update

on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 AM IST daily
  workflow_dispatch:

jobs:
  update-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests feedparser firebase-admin
      - name: Fetch & push news to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/fetch_news.py
