<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — L&T CMMB Strategy Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#001438 0%,#003087 50%,#001f5c 100%);
  padding:20px;
}
/* subtle grid pattern overlay */
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}
.card{
  background:#fff;border-radius:20px;
  width:100%;max-width:460px;
  box-shadow:0 40px 100px rgba(0,0,40,.6);
  overflow:hidden;position:relative;
}
.card-top{
  height:6px;
  background:linear-gradient(90deg,#003087 0%,#FFA800 60%,#FFD000 100%);
}
.card-body{padding:40px 44px 36px}
.brand-row{
  display:flex;align-items:center;gap:18px;
  padding-bottom:24px;margin-bottom:28px;
  border-bottom:1px solid #E8EEF6;
}
.brand-logo{
  width:64px;height:64px;flex-shrink:0;
  object-fit:contain;display:block;
}
.brand-text{}
.brand-name{
  font-size:17px;font-weight:800;color:#003087;
  line-height:1.2;letter-spacing:-.2px;
}
.brand-sub{
  font-size:12px;color:#64748B;margin-top:3px;
  font-weight:500;
}
.form-heading{
  font-size:24px;font-weight:800;color:#0F172A;
  margin-bottom:5px;letter-spacing:-.3px;
}
.form-sub{
  font-size:13px;color:#64748B;margin-bottom:28px;
}
.field{margin-bottom:18px}
label{
  display:block;font-size:11.5px;font-weight:700;
  color:#475569;text-transform:uppercase;letter-spacing:.7px;
  margin-bottom:7px;
}
input{
  width:100%;padding:13px 16px;
  border:1.5px solid #DDE4EF;border-radius:10px;
  font-size:15px;color:#0F172A;background:#F8FAFC;
  outline:none;transition:all .18s;font-family:inherit;
}
input:focus{
  border-color:#003087;background:#fff;
  box-shadow:0 0 0 4px rgba(0,48,135,.08);
}
.btn{
  width:100%;padding:15px;margin-top:8px;
  background:#003087;color:#fff;border:none;
  border-radius:10px;font-size:16px;font-weight:700;
  cursor:pointer;transition:all .18s;
  font-family:inherit;letter-spacing:.2px;
}
.btn:hover{background:#002065;transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,48,135,.35)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled{background:#94A3B8;cursor:not-allowed;transform:none;box-shadow:none}
.error{
  display:none;margin-top:14px;padding:11px 16px;
  background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;
  font-size:13px;color:#991B1B;text-align:center;font-weight:500;
}
.footer{
  text-align:center;margin-top:24px;
  font-size:11.5px;color:#94A3B8;line-height:1.6;
}
.spinner{
  display:inline-block;width:15px;height:15px;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .65s linear infinite;
  vertical-align:middle;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:500px){
  .card-body{padding:32px 28px 28px}
  .brand-logo{width:52px;height:52px}
  .form-heading{font-size:20px}
}
</style>
</head>

    <h1 class="form-heading">Strategy Intelligence Platform</h1>
    <p class="form-sub">Sign in to access your dashboards</p>
    <div class="field">

<script>
(function(){
  var LS='ltcmmb_auth_v1', EXP=30;
  function h(s){
    var n=5381,i=0;
    for(;i<s.length;i++)n=(((n<<5)+n)+s.charCodeAt(i))>>>0;
    return n.toString(16).padStart(8,'0');
  }
  var C={u:'0c376ac4',p:'c08cb671'};

  // If already authenticated, go straight to dashboard
  function getRedirect(){
    var p=new URLSearchParams(window.location.search);
    var r=p.get('r')||'';
    // Safety: never redirect back to login page
    if(!r||r.includes('login.html'))return 'index.html';
    return r;
  }
  try{
    var a=JSON.parse(localStorage.getItem(LS));
    if(a&&a.t==='ok'&&a.e&&Date.now()<a.e){
      window.location.replace(getRedirect());
      return;
    }
  }catch(e){}

  var uid=document.getElementById('uid');
  var pwd=document.getElementById('pwd');
  var btn=document.getElementById('signinBtn');
  var err=document.getElementById('errMsg');

  function attempt(){
    var u=(uid.value||'').toLowerCase().trim();
    var p=pwd.value||'';
    err.style.display='none';
    if(!u||!p){
      err.textContent='Please enter your User ID and password.';
      err.style.display='block';return;
    }
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span>Signing in…';
    setTimeout(function(){
      if(h(u)===C.u&&h(p)===C.p){
        localStorage.setItem(LS,JSON.stringify({t:'ok',e:Date.now()+EXP*86400000}));
        window.location.replace(getRedirect());
      }else{
        btn.disabled=false;btn.textContent='Sign In';
        err.textContent='Incorrect User ID or password. Please try again.';
        err.style.display='block';
        pwd.value='';pwd.focus();
      }
    },380);
  }

  btn.addEventListener('click',attempt);
  uid.addEventListener('keydown',function(e){if(e.key==='Enter')attempt();});
  pwd.addEventListener('keydown',function(e){if(e.key==='Enter')attempt();});
})();
</script>
